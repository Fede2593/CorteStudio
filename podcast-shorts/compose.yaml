services:
  cortestudio:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      WHISPER_MODEL: small
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_CPU_THREADS: 4
      MAX_UPLOAD_MB: 1800
    volumes:
      - whisper-models:/models
    restart: unless-stopped

volumes:
  whisper-models:
